spring:
  application:
    name: sodosiro
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
#  security:
#    user:
#      name: admin
#      password: 1234
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-authentication-method: client_secret_post
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            native-client-id: ${KAKAO_NATIVE_CLIENT_ID}
            authorization-grant-type: authorization_code
            scope: openid, profile_nickname, account_email
            client-name: Kakao
            admin-key: ${KAKAO_ADMIN_KEY}
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            web-redirect-uri: ${KAKAO_WEB_REDIRECT_URI:http://localhost:5173/login}


        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      region:
        static: ${AWS_S3_REGION}
        auto: false
      s3:
        bucket: ${AWS_S3_BUCKET_NAME}
      cloudfront:
        domain: ${AWS_CLOUDFRONT_DOMAIN}

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 100
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:sodosiro}
    access-token-expiration-millis: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration-millis: ${JWT_REFRESH_EXPIRATION:1209600000}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
      embedding:
        model: text-embedding-3-small

# 카카오 API는 초당·동시 호출 제한을 콘솔에도 공개하지 않는다. 동시 호출 수를 보수적으로 캡해
# 제한에 부딪히는 빈도를 줄이고, 그래도 제한 초과 응답이 오면 재시도한다(KakaoApiThrottler).
kakao:
  mobility:
    rest-api-key: ${KAKAO_CLIENT_ID}
    max-concurrent-calls: ${KAKAO_MOBILITY_MAX_CONCURRENT_CALLS:5}
    max-retries: ${KAKAO_MOBILITY_MAX_RETRIES:2}
    retry-backoff-ms: ${KAKAO_MOBILITY_RETRY_BACKOFF_MS:200}
  map:
    rest-api-key: ${KAKAO_CLIENT_ID}
    max-concurrent-calls: ${KAKAO_MAP_MAX_CONCURRENT_CALLS:2}
    max-retries: ${KAKAO_MAP_MAX_RETRIES:2}
    retry-backoff-ms: ${KAKAO_MAP_RETRY_BACKOFF_MS:200}

# 자차 예상 주유비 추정용 상수. 실시간 유가 연동 전까지 임의값으로 운영하며,
# 유가가 바뀌면 재배포 없이 이 값만 갱신한다.
route:
  fuel:
    price-per-liter-won: ${FUEL_PRICE_PER_LITER_WON:1800}
    efficiency-km-per-liter: ${FUEL_EFFICIENCY_KM_PER_LITER:10.0}

swagger:
  username: ${SWAGGER_USERNAME:admin}
  password: ${SWAGGER_PASSWORD:admin}

image:
  upload:
    max-size: 20971520

# 인기 검색어 시드 봇 인증. 이 토큰과 같은 X-Internal-Bot 헤더로 온 검색은
# dedup/제한을 무시하고 무조건 집계한다. 비어 있으면 봇 예외 처리 비활성.
search:
  bot:
    token: ${SEARCH_BOT_TOKEN:}

server:
  port: ${SERVER_PORT:8081}

notification:
  nearby:
    # 위치 업데이트 간 근처 진입 상태를 유지할 시간
    redis-ttl-seconds: ${NOTIFICATION_NEARBY_REDIS_TTL_SECONDS:300}
    minimum-interval-hours: ${NOTIFICATION_NEARBY_MINIMUM_INTERVAL_HOURS:4}
    daily-max-notifications: ${NOTIFICATION_NEARBY_DAILY_MAX_NOTIFICATIONS:2}
  review-request:
    after-days: ${NOTIFICATION_REVIEW_AFTER_DAYS:0}
    grace-days: ${NOTIFICATION_REVIEW_GRACE_DAYS:10}           # 이보다 오래된 코스는 제외
    cooldown-days: ${NOTIFICATION_REVIEW_COOLDOWN_DAYS:30}     # 같은 코스 재알림 방지

firebase:
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

course:
  recommend:
    # 사용자당 하루(KST 자정 기준) 추천 생성 가능 횟수
    daily-limit: ${COURSE_RECOMMEND_DAILY_LIMIT:5}
