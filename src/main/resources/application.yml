spring:
  application:
    name: sodosiro
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
#  security:
#    user:
#      name: admin
#      password: 1234
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-authentication-method: client_secret_post
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            native-client-id: ${KAKAO_NATIVE_CLIENT_ID}
            authorization-grant-type: authorization_code
            scope: profile_nickname, account_email
            client-name: Kakao
            admin-key: ${KAKAO_ADMIN_KEY}
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao


        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      region:
        static: ${AWS_S3_REGION}
        auto: false
      s3:
        bucket: ${AWS_S3_BUCKET_NAME}
      cloudfront:
        domain: ${AWS_CLOUDFRONT_DOMAIN}

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 100
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:sodosiro}
    access-token-expiration-millis: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration-millis: ${JWT_REFRESH_EXPIRATION:1209600000}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-5-nano}
      embedding:
        model: text-embedding-3-small

kakao:
  mobility:
    rest-api-key: ${KAKAO_CLIENT_ID}

odsay:
  api:
    key: ${ODSAY_API_KEY}

swagger:
  username: ${SWAGGER_USERNAME:admin}
  password: ${SWAGGER_PASSWORD:admin}

image:
  upload:
    max-size: 20971520

# 인기 검색어 시드 봇 인증. 이 토큰과 같은 X-Internal-Bot 헤더로 온 검색은
# dedup/제한을 무시하고 무조건 집계한다. 비어 있으면 봇 예외 처리 비활성.
search:
  bot:
    token: ${SEARCH_BOT_TOKEN:}

server:
  port: ${SERVER_PORT:8081}

