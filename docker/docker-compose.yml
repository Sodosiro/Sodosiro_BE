# 실행: 프로젝트 루트에서
#   docker compose -f docker/docker-compose.yml up --build
# 상대 경로는 이 compose 파일(docker/) 기준으로 해석된다.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sodosiro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sodosiro}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # postgres/ 전체 마운트: SQL 파일 + seed CSV 접근용
      - ./postgres:/docker/postgres:ro
      # 볼륨이 빈 상태(첫 기동)일 때만 자동 실행
      - ./db-init.sh:/docker-entrypoint-initdb.d/db_init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-sodosiro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sodosiro-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sodosiro-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sodosiro}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${APP_HOST_PORT:-8082}:${SERVER_PORT:-8081}"
    volumes:
      - ../logs:/app/logs

volumes:
  postgres-data:
  redis-data:
