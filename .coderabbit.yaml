# CodeRabbit 설정 파일
# 문서: https://docs.coderabbit.ai/reference/configuration
language: "ko-KR"

tone_instructions: >
  1. 단순히 문제를 지적하는 것에 그치지 않고, 왜 문제인지 원인까지 설명해주세요.
  2. 더 나은 코드를 작성할 수 있도록 관련 레퍼런스나 공식 문서를 함께 제안해주세요.

early_access: false

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "develop"

  path_filters:
    - "!**/*.md"
    - "!**/gradle/**"
    - "!**/gradlew"
    - "!**/gradlew.bat"
    - "!**/.idea/**"
    - "!**/build/**"

  path_instructions:
    - path: "src/main/java/**/*.java"
      instructions: >
        Spring Boot 백엔드 코드입니다. 다음 관점에서 리뷰해주세요:
        - [객체지향 설계]: 캡슐화가 잘 되어 있는지, 응집도가 높고 결합도가 낮은지 확인해주세요.
        - [정적 팩토리 메서드]: 생성자 대신 의도를 명확히 드러내는 정적 팩토리 메서드(예: of, from) 사용을 권장해주세요.
        - [계층 설계]: 계층 간 책임 분리(Controller/Service/Repository)가 명확한지, 순환 참조가 발생하지 않는지 확인해주세요.
        - [예외 및 트랜잭션]: 예외 처리 전략이 일관된지, 트랜잭션 범위가 적절한지 체크해주세요.
        - [보안 및 데이터]: JPA 연관관계(FetchType 등)와 JWT/소셜 로그인 구현 시 보안 취약점(취약한 암호화, 검증 누락 등)이 없는지 확인해주세요.
    - path: "src/test/java/**/*.java"
      instructions: >
        테스트 코드입니다. 테스트 대상과 검증 내용이 명확한지,
        불필요하게 구현 세부사항에 의존하지 않는지 확인해주세요.

chat:
  auto_reply: true
